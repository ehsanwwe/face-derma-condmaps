paths:
  image_root: "D:/filter_asian/filter_asian(1024x1024)"
  output_root: "D:/face_parsing/outputs"
  bisenet_ckpt: "D:/projects/face-derma-condmaps/models/79999_iter.pth"

runtime:
  use_cuda: true
  # 파일 로딩/검출 단계의 스레드 수(디스크/CPU 병렬 I/O용)
  num_workers: 8
  # 정렬 얼굴 + 스코어 텍스트가 들어간 미리보기 PNG 저장 여부
  save_previews: true
  # 미리보기 저장 상한(너무 많으면 용량 커지니 제한)
  preview_max: 200
  # ↓ 속성 히트맵 저장 관련 플래그들 (GAN 조건 지도 생성 목적)
  save_maps: true                     # 히트맵 저장 전체 on/off
  save_maps_png: true                 # 시각화용 컬러 PNG 저장
  save_maps_npy: true                 # 훈련용 float32 [0..1] NPY 저장(권장)
  save_cond_tile_png: true            # cond tile 저장
  save_aligned: true                  # 정렬된 얼굴 png 저장

align:
  # InsightFace로 정렬 후 리사이즈할 최종 해상도(텍스처 민감도/속도 트레이드오프)
  # 512: 빠름/안정, 768~1024: 미세 텍스처(모공/잔주름) 민감도 ↑, 속도/VRAM ↑
  out_size: 512

parsing:
  # 파싱 백엔드 선택(zll_bisenet: zllrunning/face-parsing.PyTorch)
  backend: "zll_bisenet"
  # BiSeNet 입력 해상도(체크포인트가 주로 512 기준)
  input_size: 512

  labels:
    # 아래 인덱스는 CelebAMask-HQ의 관례값. 체크포인트에 따라 다를 수 있어
    # 샘플 미리보기로 반드시 검증 권장.
    skin: 1                           # 피부 라벨 인덱스
    nose: 10                          # 코 라벨 인덱스
    upper_lip: 12                     # 윗입술 라벨 인덱스
    lower_lip: 13                     # 아랫입술 라벨 인덱스
    hair: 17                          # 머리카락 라벨 인덱스
    eyebrow_left: 2                   # 확실하지 않음 → 필요 시 값 확인 후 수정
    eyebrow_right: 3                  # 확실하지 않음 → 필요 시 값 확인 후 수정

  postprocess:
    # 피부 마스크 후처리(경계 스무딩/노이즈 억제/입술·헤어 제외)
    include_nose: true                # 코를 피부에 포함
    smooth_open: 1                    # 작은 노이즈 제거(모폴로지 Open) 커널 반경(픽셀)
    smooth_close: 1                   # 작은 구멍 메우기(모폴로지 Close) 커널 반경(픽셀)
    erode_skin_px: 2                  # 피부 마스크 전체를 안쪽으로 축소(헤어라인 침범 완화)
    exclude_lips: true                # 입술을 피부 마스크에서 제외(홍조 계산에 유리)
    exclude_hair_boundary_px: 3       # 헤어 마스크 dilate 후 그 경계를 피부에서 제거할 픽셀 수
    exclude_eyebrows: true            # 눈썹 제외 (홍조/주름 맵 과상승 방지)
    boundary_fallof_px: 2             # 경계로 갈수록 감쇠(halo 억제)

metrics:
  redness:                            # 홍조(얼굴 L*a*b*의 a* 채널 기반)
    cheek_mask_erode: 3               # 스코어 산출 시 피부 마스크 추가 erode(볼 중심 강조)
    a_star_clip_percentiles: [5, 95]  # a* 퍼센타일 클리핑(이상치 억제)
    map_smooth_sigma: 1.5             # 히트맵 가우시안 블러 시그마(부드럽게)

    # L채널 가이드 보정
    l_guided:
      use: true                       # true면 적용
      method: guided                  # guided | bilateral | gaussian
      redius: 15                      # 필터 반경(픽셀)
      eps: 0.001                      # guidedFilter 정규화 항
      alpha: 1.2                      # 가중 강도(1.0 ~ 1.5 권장)
      clip_w: [0.6, 1.4]              # 가중치 클램프 범위

  wrinkle:
    # 주름(라플라시안+가보 필터 반응): 고주파 텍스처 강도
    laplacian_ksize: 3

    gabor:
      thetas: [0, 45, 90, 135]        # 방향 민감도
      lambdas: [4, 8]                 # 파장(주기)
      sigmas: [2.0, 3.0]              # 커널 폭

    map_percentiles: [5, 95]          # 히트맵 정규화 기준 퍼센타일(피부 영역 기준)

  pore:
    # 모공(DoG 대역통과 반응)
    dog:
      sigma_small: 0.9                # 작은 가우시안 시그마
      sigma_large: 2.2                # 큰 가우시안 시그마

    map_percentiles: [3, 97]          # 히트맵 정규화 기준 퍼센타일(피부 영역 기준)

qc:
  # 품질 점검(참고용): 블러/노출 분포
  blur_varlap_thresh: 30.0            # 라플라시안 분산 임계(낮으면 흐림 가능)
  exposure_low_pct: 1.0               # 노출 하위 퍼센타일(너무 어두움 감지용)
  exposure_high_pct: 99.0             # 노출 상위 퍼센타일(너무 밝음 감지용)
  skin_cov_min: 0.30